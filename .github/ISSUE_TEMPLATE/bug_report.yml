name: 问题报告
description: ApiYard 的行为不对，或者和 YApi 不一致
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: ApiYard 版本
      description: "`apiyard version` 的输出"
    validations:
      required: true
  - type: dropdown
    id: deploy
    attributes:
      label: 部署方式
      options:
        - 可执行文件
        - Docker
        - 源码运行
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 问题描述
      description: 做了什么、期望什么、实际发生了什么。和 YApi 行为不同时，请写明 YApi 的表现。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. ……
        2. ……
  - type: textarea
    id: logs
    attributes:
      label: 日志或接口响应
      description: 请去掉账号、token 等敏感信息。
      render: text
  - type: input
    id: tool
    attributes:
      label: 相关的周边工具
      description: 如果是 easy-yapi、yapi-to-typescript 等工具接入时出的问题，写明工具和版本
