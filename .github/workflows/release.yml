# 推送 v* 标签时发布：GitHub Release 草稿（六个平台的压缩包和校验文件）和 ghcr.io 上的多架构镜像。
# Release 是草稿，确认说明和附件无误后在网页上点“Publish release”才会公开。
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  binaries:
    name: 可执行文件
    runs-on: ubuntu-latest
    permissions:
      contents: write # 创建 Release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
      - name: 下载 YApi 前端
        run: go run ./tools/fetch-yapi-web
      - name: 测试
        run: go test ./...
      - name: 编译并打包六个平台
        run: go run ./tools/dist -version "$GITHUB_REF_NAME"
      - name: 创建 Release 草稿
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--draft --title "$GITHUB_REF_NAME" --generate-notes --verify-tag)
          # 带后缀的版本（如 v0.1.0-rc.1）标为预发布
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" dist/*.tar.gz dist/*.zip dist/checksums.txt

  image:
    name: Docker 镜像
    runs-on: ubuntu-latest
    permissions:
      packages: write # 推送到 ghcr.io
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # v0.1.0 → 0.1.0、0.1；预发布版本只打完整版本号，latest 只给正式版本
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
