# 每次推送到 main 和每个 PR：测试、代码检查、六个平台的编译、Docker 镜像构建（不推送）
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 测试与代码检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
      - name: 下载 YApi 前端
        run: go run ./tools/fetch-yapi-web
      - name: go vet
        run: go vet ./...
      - name: Go 依赖漏洞检查
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: 测试
        run: go test -race ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

  build:
    name: 交叉编译
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
      - name: 下载 YApi 前端
        run: go run ./tools/fetch-yapi-web
      - name: 编译并打包六个平台
        run: go run ./tools/dist -version v0.0.0-ci
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  docker:
    name: Docker 镜像
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: 构建两个架构的镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
